services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
      POSTGRES_DB: watcher
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  migrate:
    build: ./backend
    command: ["npm", "run", "migrate"]
    environment: &app-env
      NODE_ENV: development
      DATABASE_URL: postgres://watcher:watcher@db:5432/watcher
      JWT_ACCESS_SECRET: local-dev-secret-change-me-at-least-32-characters-long
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_PUBLIC_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: kafka
      KAFKA_BROKERS: kafka:19092
      KAFKA_AUTO_CREATE_TOPICS: "true"
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: "1"
      NOTIFIER_TICK_SECONDS: "5"
      NOTIFY_BATCH_SIZE: "20"
      NOTIFY_MAX_ATTEMPTS: "5"
      NOTIFY_BACKOFF_SECONDS: 30,120,600,1800
      NOTIFY_TIMEOUT_MS: "10000"
      ALERT_COOLDOWN_SECONDS: "600"
      NOTIFY_MAX_PER_CHANNEL_PER_HOUR: "20"
      MAX_CHANNELS_PER_USER: "5"
      RESULT_RETENTION_DAYS: "8"
      NOTIFICATION_RETENTION_DAYS: "30"
      INCIDENT_RETENTION_DAYS: "90"
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    command: ["node", "dist/server.js"]
    environment:
      <<: *app-env
      ROLES: api
      PORT: "8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  scheduler:
    build: ./backend
    command: ["node", "dist/server.js"]
    environment:
      <<: *app-env
      ROLES: scheduler
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  consumer:
    build: ./backend
    command: ["node", "dist/server.js"]
    environment:
      <<: *app-env
      ROLES: consumer
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notifier:
    build: ./backend
    command: ["node", "dist/server.js"]
    environment:
      <<: *app-env
      ROLES: notifier
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  pgdata:
